<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="m.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" 
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer" />
</head>
<body>
    <form class="container">
        <h1> Currency Converter </h1>

        <div class="amount">
            <p>Enter Amount</p>
            <input value="1" type="text"/>
        </div>

        <div class="dropdown">
            <div class="from">
                <p>From</p>
                <div class="slect-container">
                    <img class="img" src="https://flagsapi.com/US/flat/64.png">
                    <select class="option" name="from">
                        <!-- option -->
                    </select>
                </div>
            </div>

            <i class="fa-solid fa-arrow-right-arrow-left"></i>
            <div class="To">
                <p>To</p>
                <div class="slect-container">
                    <img class="img" src="https://flagsapi.com/IN/flat/64.png">
                    <select class="option" name="To">
                        <!-- <option value="INR" selected>INR</option> -->
                    </select>
                </div>
            </div>

        </div>
        <div class="msg">1USD = 80INR</div>
        <button>Get Exchange Rate</button>
    </form>
    <script src="countryID.js"></script>
    <script src="m.js"></script>

</body>
</html>
